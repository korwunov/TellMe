version: '2'

services:
  client:
    build:
      dockerfile: ./client/Dockerfile
    container_name: tellme_client
    depends_on:
      - server
    environment:
      - REACT_APP_HOST_URL=server:8000
    ports:
      - "3000:3000"
    volumes:
      - ./client/nginx.conf:/etc/nginx/conf.d/default.conf

  server:
    build:
      dockerfile: ./server/Dockerfile
    container_name: tellme_server
    depends_on:
      - mongo
    environment:
      - PORT=8000
      - MONGO_URI=mongo
      - MONGO_PORT=27017
      - MONGO_DB_NAME=TELLME
      - AUTH_SECRET_KEY=78y945yhf45gwp08ghy0pghywe048ty7gh
    ports:
      - "8000:8000"

  mongo:
    image: mongo:latest
    ports:
      - "27017:27017"

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - server

  